name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
      - name: Lint for macOS (Apple Silicon and Intel)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo clippy --release --all-targets --target aarch64-apple-darwin -- -D warnings
          cargo clippy --release --all-targets --target x86_64-apple-darwin -- -D warnings
      - name: Tests (clone backend, as a normal user)
        run: cargo test --release -- --test-threads=4
      - name: Tests (overlay backend, as root)
        run: sudo env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" cargo test --release -- --test-threads=4
