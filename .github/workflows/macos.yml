name: macOS

# The whole Mac test, as a developer runs it locally (demo/mac-test.sh): the
# test suite on APFS, the four-session demo replaying the agents' commits,
# a 100-session scale test, and the APFS session benchmark.
on:
  push:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Mac test
        run: demo/mac-test.sh
