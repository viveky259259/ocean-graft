[package]
name = "ocean-graft"
version = "0.2.1"
license = "MIT"
repository = "https://github.com/viveky259259/ocean-graft"
edition = "2021"
description = "Copy-on-write session volumes for running coding agents in parallel"
publish = false

[[bin]]
name = "ocean-graft"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"

# Standalone: not part of any parent workspace.
[workspace]
