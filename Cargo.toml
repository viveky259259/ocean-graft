[package]
name = "shoal"
version = "0.1.0"
edition = "2021"
description = "Copy-on-write session volumes for running coding agents in parallel"
publish = false

[[bin]]
name = "shoal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"

# Standalone: not part of any parent workspace.
[workspace]
