[package]
name = "shoal"
version = "0.2.0"
license = "MIT"
repository = "https://github.com/viveky259259/ocean_fs"
edition = "2021"
description = "Copy-on-write session volumes for running coding agents in parallel"
publish = false

[[bin]]
name = "shoal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"

# Standalone: not part of any parent workspace.
[workspace]
